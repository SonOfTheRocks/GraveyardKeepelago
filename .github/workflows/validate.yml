name: Validate shared data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shared-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shared data contract
        run: python External/GraveyardKeeperData/validate_contract.py
